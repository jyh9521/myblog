# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: jyh9521/myblog
  branch: main
  auth_methods: [token]

# Built-in Git uploads blocked; use the R2 controls.
media_folder: /public/uploads
media_libraries:
  default:
    config:
      max_file_size: 0
public_folder: /uploads
output:
  omit_empty_optional_fields: true

collections:
  - name: post
    label: 文章
    label_singular: 文章
    folder: /content/posts
    extension: md
    format: yaml-frontmatter
    preview_path: /posts/{{filename}}/
    slug:
      editable: true
      hint: 文章网址名（/posts/ 后的部分）；在右侧 Slug 面板点击铅笔修改，例如 wish-list。保存并部署后生效，旧网址随之改变。
      pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '只允许小写英文字母、数字和连字符']
    fields:
      - { name: title, label: 标题, widget: string, required: true }
      - name: date
        label: 发布日期
        widget: datetime
        type: date
        required: true
        default: '{{now}}'
      - { name: description, label: 摘要, widget: text, required: false }
      - { name: cover, label: 封面图片, widget: r2-image, required: false }
      - { name: tags, label: 标签, widget: list, required: false }
      - { name: pinned, label: 置顶文章, widget: boolean, required: false, default: false }
      - { name: updatedAt, label: 最近更新日期, widget: datetime, type: date, required: false }
      - { name: updateNote, label: 更新说明, widget: text, required: false }
      - { name: gameSlug, label: 关联游戏档案, widget: game-archive-picker, required: false, hint: "展开下拉框，用手动名称、原名或别名筛选已有档案；显示手动覆盖名称。不需要关联时可取消关联。" }
      - { name: access, label: 文章访问设置, widget: article-access, required: false, hint: "公开 / 密码访问 / 仅链接可见。密码正文单独保存到私密存储，GitHub 只保存引用。" }
      - { name: body, label: 正文, widget: richtext, required: false, editor_components: [code-block, r2-image, game-card, image-compare, horizontal-rule, pdf], hint: "图片描述优先读取 Markdown 图片引号标题。点击添加游戏，在可搜索下拉框中选择已保存的游戏档案；默认显示档案的手动覆盖名称。已有平台游戏卡片继续兼容。截图前后对比按钮可插入两张图并拖动滑块查看差异。代码块支持一键复制。插入 PDF 按钮可从共用资源库上传或选择 PDF，并在正文内嵌阅读。" }
      - { name: audio, label: 音频文件, widget: r2-file, required: false }
      - { name: video, label: 视频文件, widget: r2-file, required: false }
      - { name: attachment, label: 下载附件, widget: r2-file, required: false }
  - name: games
    label: 游戏档案
    folder: /content/games
    extension: md
    format: yaml-frontmatter
    create: true
    slug:
      editable: true
      pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '只允许小写英文字母、数字和连字符']
    fields:
      - { name: title, label: 手动名称覆盖（最高优先级）, widget: string, required: false, hint: "显示名称覆盖，不影响本地档案 slug 或任何数据源 ID。" }
      - name: status
        label: 当前状态
        widget: select
        required: true
        multiple: true
        min: 1
        default: [想玩]
        options: [想玩, 正在玩, 已通关, 暂时搁置, AFK, 考虑制作补丁, 已制作补丁]
        hint: "可多选，例如已通关 + 已制作补丁；至少选择一项。开始、通关、回坑及补丁发布等历史记录保留在时间线中。"
      - { name: summary, label: 简介, widget: text, required: false }
      - name: playTime
        label: 我的游玩时长
        widget: object
        required: false
        collapsed: false
        hint: "小时支持小数，例如直接填 3.8 → 3.8 小时，此时分钟留空即可。小时和分钟都填写时相加，例如 3.8 小时 + 12 分钟 → 4.0 小时。前台保留一位小数。留空不展示。"
        fields:
          - { name: hours, label: 小时（支持小数）, widget: number, value_type: float, min: 0, required: false }
          - { name: minutes, label: 分钟, widget: number, value_type: int, min: 0, max: 59, required: false }
      - name: personalRating
        label: 我的评分（10 分制）
        widget: number
        value_type: float
        min: 0
        max: 10
        step: 0.01
        required: false
        hint: "留空不展示；0 分也会展示。前台保留两位小数，并自动换算个人好评度，例如 8.00 分 → 80%，8.12 分 → 81.2%。更多小数位按四舍五入展示。"
      - name: hltb
        label: HowLongToBeat 关联与参考通关时间
        widget: hltb-game
        required: false
        hint: "搜索并明确选择版本后关联 HLTB ID；自动数据由 Worker + D1 缓存 14 天。手动时间作为覆盖，不影响个人实际游玩时长。"
      - { name: gameMetadata, label: 游戏资料（元数据来源）, widget: game-metadata, required: false, hint: "搜索候选后手动确认并导入；在资料组件中勾选要生成档案卡片的平台。资料保留完整平台清单，前台仅显示勾选的平台卡片。" }
      - { name: manual, label: 正版渠道与人工状态, widget: game-manual, required: false, hint: "正版售卖渠道、可获得状态和备注独立于资料数据源；刷新游戏资料不会覆盖。" }
      - name: events
        label: 时间线事件
        widget: list
        required: false
        fields:
          - { name: date, label: 日期, widget: datetime, type: date, required: false }
          - { name: title, label: 事件, widget: select, options: [开始游戏, 通关游戏, 开始汉化工作, 开始测试汉化, 已发布汉化补丁, AFK], required: true }
          - { name: note, label: 说明, widget: richtext, editor_components: [code-block, r2-image, game-card, image-compare, horizontal-rule, pdf], required: false, hint: "与文章正文共用编辑器：支持标题、粗体、列表、链接、表格及插图；图片使用共用 R2 资源库。" }
      - name: projects
        label: 关联 GitHub 项目
        widget: list
        required: false
        summary: '{{fields.name}} · {{fields.type}}'
        hint: "可关联多个项目。文章卡片自动复用；不实时请求 GitHub。"
        fields:
          - { name: url, label: 仓库地址, widget: string, pattern: ['^https://github\.com/[A-Za-z0-9-]+/[A-Za-z0-9_.-]+/?$', '填写完整 GitHub 仓库地址'], required: true }
          - { name: name, label: 展示名称, widget: string, required: false, hint: "留空时显示 owner/repo。" }
          - { name: type, label: 项目类型, widget: select, options: [汉化补丁, 工具, 现代化补丁, 其他], default: 汉化补丁 }
          - { name: description, label: 简短说明, widget: text, required: false }
          - { name: releaseUrl, label: 发布页地址, widget: string, required: false, hint: "可选，填写该仓库 Releases 或指定版本地址；留空不显示下载按钮。" }


  - name: chronologies
    label: 独立系列时间线
    label_singular: 年表资料
    folder: /content/chronologies
    extension: json
    format: json
    create: true
    identifier_field: id
    slug: '{{id}}'
    summary: '{{title}}'
    preview_path: 'chronicles/{{slug}}/'
    fields:
      - { name: id, label: 年表 ID（与文件名一致）, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '使用小写英文、数字和连字符'] }
      - { name: title, label: 标题, widget: string }
      - { name: description, label: 简介与整理范围, widget: text }
      - { name: calendarNote, label: 纪年说明, widget: text }
      - name: works
        label: 作品（ID 用于事件关联及剧透控制）
        widget: list
        fields:
          - { name: id, label: 作品 ID, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '使用小写英文、数字和连字符'] }
          - { name: title, label: 作品名, widget: string }
      - name: eras
        label: 时代（按此列表顺序展示，不跨纪年比较年份）
        widget: list
        fields:
          - { name: id, label: 时代 ID, widget: string }
          - { name: title, label: 时代标题（避免包含剧情揭秘）, widget: string }
          - { name: calendar, label: 所属纪年, widget: string }
          - { name: note, label: 分段说明（仅放非剧透信息）, widget: text, required: false }
      - name: sources
        label: 资料来源
        widget: list
        fields:
          - { name: id, label: 来源 ID, widget: string }
          - { name: title, label: 作者与资料标题, widget: string }
          - { name: url, label: 原文链接, widget: string }
          - { name: kind, label: 资料类型, widget: string, required: false }
          - { name: family, label: 同源资料家族, widget: string, required: false }
          - { name: scope, label: 适用范围与局限, widget: text, required: false }
      - name: events
        label: 历史事件（不要填写个人游玩动态）
        widget: list
        summary: '{{fields.year}} · {{fields.title}}'
        fields:
          - { name: id, label: 事件 ID, widget: string }
          - { name: era, label: 时代 ID, widget: string }
          - { name: year, label: 显示年份（保留约、区间或不详）, widget: string }
          - { name: yearOrder, label: 时代内年份排序值, widget: number, value_type: float, hint: '仅在该时代内比较，不强制将约数或其他纪年换算为精确日期。' }
          - { name: day, label: 日期或日数范围, widget: string, required: false }
          - { name: order, label: 同年事件排序值, widget: number, value_type: float }
          - { name: title, label: 事件标题, widget: string }
          - { name: summary, label: 简短经过, widget: text }
          - { name: detail, label: 详细经过, widget: text, required: false }
          - { name: note, label: 版本差异与考据说明, widget: text, required: false }
          - { name: keywords, label: 人物原名、别名与地点检索词, widget: list, required: false }
          - { name: works, label: 关联作品 ID 列表, widget: list, min: 1 }
          - { name: spoilerWorks, label: 需要允许剧透的作品 ID 列表, widget: list, required: true, min: 0, default: [], hint: '必须明确填写。无剧透可设空列表；涉及多个作品揭秘时填写全部作品 ID。不要只按事件发生年代判断。' }
          - name: evidence
            label: 依据类型
            widget: chronology-evidence
            default: compiled
          - { name: sources, label: 来源 ID 列表, widget: list, min: 1 }
          - { name: verification, label: 剧情核对状态, widget: select, options: [crosschecked, single-source, conflict], required: false }
          - { name: dateStatus, label: 日期核对状态, widget: select, options: [crosschecked, single-source, conflict, undated], required: false }
          - { name: sourceLines, label: 底本覆盖行号（保留供自动审计）, widget: list, required: false }
          - name: citations
            label: 逐条引证（剧情与日期分开）
            widget: list
            required: false
            fields:
              - { name: source, label: 来源 ID, widget: string }
              - { name: locator, label: 章节、场景或原文定位, widget: text }
              - { name: supports, label: 支持范围, widget: select, options: [event, date, context, variant] }
              - { name: note, label: 依据与局限, widget: text, required: false }
          - { name: related, label: 关联事件 ID 列表, widget: list, required: false }

  - name: pages
    label: 页面
    files:
      - name: about
        label: 关于我
        file: /content/about.md
        fields:
          - { name: title, label: 标题, widget: string }
          - { name: intro, label: 简介, widget: text, required: false }
          - { name: body, label: 正文, widget: richtext }
