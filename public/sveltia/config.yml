# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: jyh9521/myblog
  branch: main
  auth_methods: [token]

media_folder: /public/uploads
public_folder: /uploads
output:
  omit_empty_optional_fields: true

collections:
  - name: post
    label: 文章
    label_singular: 文章
    folder: /content/posts
    extension: md
    format: yaml-frontmatter
    preview_path: /posts/{{filename}}/
    slug:
      editable: true
      hint: 文章网址名（/posts/ 后的部分）；在右侧 Slug 面板点击铅笔修改，例如 wish-list。保存并部署后生效，旧网址随之改变。
      pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '只允许小写英文字母、数字和连字符']
    fields:
      - { name: title, label: 标题, widget: string, required: true }
      - name: date
        label: 发布日期
        widget: datetime
        type: date
        required: true
        default: '{{now}}'
      - { name: description, label: 摘要, widget: text, required: false }
      - { name: cover, label: 封面图片, widget: image, required: false }
      - { name: tags, label: 标签, widget: list, required: false }
      - { name: pinned, label: 置顶文章, widget: boolean, required: false, default: false }
      - { name: updatedAt, label: 最近更新日期, widget: datetime, type: date, required: false }
      - { name: updateNote, label: 更新说明, widget: text, required: false }
      - { name: gameSlug, label: 关联游戏档案, widget: game-archive-picker, required: false, hint: "展开下拉框，用手动名称、原名或别名筛选已有档案；显示手动覆盖名称。不需要关联时可取消关联。" }
      - { name: body, label: 正文, widget: richtext, required: true, editor_components: [code-block, image, game-card, image-compare, horizontal-rule, pdf], hint: "图片描述优先读取 Markdown 图片引号标题。点击添加游戏，在可搜索下拉框中选择已保存的游戏档案；默认显示档案的手动覆盖名称。已有平台游戏卡片继续兼容。截图前后对比按钮可插入两张图并拖动滑块查看差异。代码块支持一键复制。插入 PDF 按钮可从共用资源库上传或选择 PDF，并在正文内嵌阅读。" }
      - { name: audio, label: 音频文件, widget: file, required: false }
      - { name: video, label: 视频文件, widget: file, required: false }
      - { name: attachment, label: 下载附件, widget: file, required: false }
  - name: games
    label: 游戏档案
    folder: /content/games
    extension: md
    format: yaml-frontmatter
    create: true
    slug:
      editable: true
      pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '只允许小写英文字母、数字和连字符']
    fields:
      - { name: title, label: 手动名称覆盖（最高优先级）, widget: string, required: false, hint: "显示名称覆盖，不影响本地档案 slug 或任何数据源 ID。" }
      - name: status
        label: 当前状态
        widget: select
        required: true
        multiple: true
        min: 1
        default: [想玩]
        options: [想玩, 正在玩, 已通关, 暂时搁置, AFK, 考虑制作补丁, 已制作补丁]
        hint: "可多选，例如已通关 + 已制作补丁；至少选择一项。开始、通关、回坑及补丁发布等历史记录保留在时间线中。"
      - { name: summary, label: 简介, widget: text, required: false }
      - name: playTime
        label: 我的游玩时长
        widget: object
        required: false
        collapsed: false
        hint: "记录累计游玩时间；小时和分钟可只填一项。前台自动换算为一位小数的小时，例如 12 小时 30 分钟 → 12.5 小时。留空不展示。"
        fields:
          - { name: hours, label: 小时, widget: number, value_type: int, min: 0, required: false }
          - { name: minutes, label: 分钟, widget: number, value_type: int, min: 0, max: 59, required: false }
      - name: hltb
        label: HowLongToBeat 关联与参考通关时间
        widget: hltb-game
        required: false
        hint: "搜索并明确选择版本后关联 HLTB ID；自动数据由 Worker + D1 缓存 14 天。手动时间作为覆盖，不影响个人实际游玩时长。"
      - { name: gameMetadata, label: 游戏资料（元数据来源）, widget: game-metadata, required: false, hint: "搜索候选后手动确认并导入；在资料组件中勾选要生成档案卡片的平台。资料保留完整平台清单，前台仅显示勾选的平台卡片。" }
      - { name: manual, label: 正版渠道与人工状态, widget: game-manual, required: false, hint: "正版售卖渠道、可获得状态和备注独立于资料数据源；刷新游戏资料不会覆盖。" }
      - name: events
        label: 时间线事件
        widget: list
        required: false
        fields:
          - { name: date, label: 日期, widget: datetime, type: date, required: false }
          - { name: title, label: 事件, widget: string, required: true }
          - { name: note, label: 说明, widget: text, required: false }
      - name: projects
        label: 关联 GitHub 项目
        widget: list
        required: false
        summary: '{{fields.name}} · {{fields.type}}'
        hint: "可关联多个项目。文章卡片自动复用；不实时请求 GitHub。"
        fields:
          - { name: url, label: 仓库地址, widget: string, pattern: ['^https://github\.com/[A-Za-z0-9-]+/[A-Za-z0-9_.-]+/?$', '填写完整 GitHub 仓库地址'], required: true }
          - { name: name, label: 展示名称, widget: string, required: false, hint: "留空时显示 owner/repo。" }
          - { name: type, label: 项目类型, widget: select, options: [汉化补丁, 工具, 现代化补丁, 其他], default: 汉化补丁 }
          - { name: description, label: 简短说明, widget: text, required: false }
          - { name: releaseUrl, label: 发布页地址, widget: string, required: false, hint: "可选，填写该仓库 Releases 或指定版本地址；留空不显示下载按钮。" }

  - name: pages
    label: 页面
    files:
      - name: about
        label: 关于我
        file: /content/about.md
        fields:
          - { name: title, label: 标题, widget: string }
          - { name: intro, label: 简介, widget: text, required: false }
          - { name: body, label: 正文, widget: richtext }
