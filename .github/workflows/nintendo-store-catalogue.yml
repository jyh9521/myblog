name: Update Nintendo store catalogue
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nintendo-store-catalogue
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-nintendo-store-catalogue.mjs
      - name: Publish changed catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/nintendo-store-catalogue.json; then exit 0; fi
          git config user.name 'BLFY'
          git config user.email 'jyh9521@users.noreply.github.com'
          git add public/data/nintendo-store-catalogue.json
          git commit -m "Refresh Japanese Nintendo store catalogue"
          git push
          gh workflow run pages.yml --ref main
