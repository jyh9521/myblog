name: Deploy blog to Workers and Pages fallback
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    # Serialize primary releases without waiting for an older Pages deploy.
    concurrency:
      group: blog-primary-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci --prefix workers/gaming-accounts
      - run: npm ci --prefix workers/static-preview
      - run: npm test
      - run: npm run check
      - run: npm run validate
      - run: npm run audit:links
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-validation
          path: reports/*.json
          if-no-files-found: ignore
      - run: npm run build
      - run: cp CNAME out/CNAME
      - run: node scripts/prepare-static-host.cjs
        env:
          BLOG_RELEASE: ${{ github.sha }}
      - name: Deploy primary Workers Static Assets
        run: node workers/static-preview/node_modules/wrangler/bin/wrangler.js deploy --config workers/static-host/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cf4b9d821c2fe041b84fa71647e57bcd
      - name: Verify primary release
        run: node scripts/verify-static-host.cjs https://blog.blfy.cc
        env:
          BLOG_RELEASE: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    # Keep the existing Pages lock, including while an older workflow is
    # already deploying to the same fallback site.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Only the actual publishing job creates a deployment record.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
