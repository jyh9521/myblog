name = "ns-visit-counter"
main = "src/index.js"
compatibility_date = "2026-09-27"

[[d1_databases]]
binding = "DB"
database_name = "ns-counter"
database_id = "0c74164d-d224-420b-bebc-af05b8648073"
migrations_dir = "migrations"

[route]
pattern = "blog.blfy.cc/ns/api/*"
zone_name = "blfy.cc"

[[services]]
binding = "GAME_ADMIN"
service = "blog-gaming-accounts"

[[durable_objects.bindings]]
name = "IGDB_API"
class_name = "IgdbApi"

[exports.IgdbApi]
type = "durable-object"
storage = "sqlite"
